<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SCM Rugby Babice – Trenérský portál</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Rugby Babice">
    <meta name="theme-color" content="#0f172a">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        babice: {
                            dark: '#0f172a',
                            card: '#1e293b',
                            green: '#22c55e',
                            blue: '#0284c7',
                            accent: '#38bdf8'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        body { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen pb-20 select-none">

    <!-- Horní hlavička -->
    <header class="sticky top-0 z-40 bg-slate-900/95 backdrop-blur border-b border-slate-800 px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div class="h-10 w-10 rounded-lg bg-gradient-to-br from-emerald-600 to-sky-600 flex items-center justify-center font-black text-white text-base shadow-md border border-slate-700">
                RB
            </div>
            <div>
                <h1 class="font-bold text-base leading-none text-white tracking-wide">SCM RUGBY BABICE</h1>
                <p class="text-xs text-slate-400 font-medium mt-0.5">Trenérský portál • Zimní příprava</p>
            </div>
        </div>
        <button onclick="fetchData()" title="Obnovit data" class="p-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg border border-slate-700 active:scale-95 transition">
            <i data-lucide="refresh-cw" class="w-5 h-5" id="refresh-icon"></i>
        </button>
    </header>

    <!-- Stavové hlášení -->
    <div id="status-bar" class="px-4 py-2 bg-slate-900 border-b border-slate-800 text-xs text-slate-400 flex items-center justify-between">
        <span id="status-text" class="flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Načítání dat z tabulky...
        </span>
        <span id="last-update" class="text-[10px] text-slate-500"></span>
    </div>

    <!-- Hlavní obsahový kontejner -->
    <main class="max-w-3xl mx-auto p-4">

        <!-- SEKCE 1: TRÉNINKY -->
        <section id="sec-treninky" class="tab-content block space-y-4">
            <div class="flex items-center justify-between mb-2">
                <h2 class="text-lg font-bold text-white flex items-center gap-2">
                    <i data-lucide="calendar" class="w-5 h-5 text-emerald-400"></i> Tréninkové jednotky
                </h2>
                <span class="text-xs text-slate-400">Zimní příprava 2026/27</span>
            </div>
            <div id="container-treninky" class="space-y-4"></div>
        </section>

        <!-- SEKCE 2: KNIHOVNA CVIČENÍ -->
        <section id="sec-cviceni" class="tab-content hidden space-y-4">
            <div class="flex flex-col gap-3">
                <div class="flex items-center justify-between">
                    <h2 class="text-lg font-bold text-white flex items-center gap-2">
                        <i data-lucide="database" class="w-5 h-5 text-sky-400"></i> Knihovna cvičení
                    </h2>
                </div>
                <div class="relative">
                    <i data-lucide="search" class="w-4 h-4 absolute left-3 top-3 text-slate-500"></i>
                    <input type="text" id="search-cviceni" oninput="filterCviceni()" placeholder="Hledat cvičení (např. A1, Akcelerace...)" 
                           class="w-full bg-slate-900 border border-slate-800 rounded-lg pl-9 pr-4 py-2 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-sky-500">
                </div>
                <div class="flex gap-2 overflow-x-auto no-scrollbar pb-1 text-xs">
                    <button onclick="filterCat('Vše')" class="cat-btn active bg-sky-600 text-white px-3 py-1.5 rounded-full font-medium whitespace-nowrap">Vše</button>
                    <button onclick="filterCat('Akcelerace')" class="cat-btn bg-slate-800 text-slate-300 px-3 py-1.5 rounded-full font-medium whitespace-nowrap border border-slate-700">Akcelerace</button>
                    <button onclick="filterCat('Max. rychlost')" class="cat-btn bg-slate-800 text-slate-300 px-3 py-1.5 rounded-full font-medium whitespace-nowrap border border-slate-700">Max. rychlost</button>
                    <button onclick="filterCat('Rychlá síla a plyometrie')" class="cat-btn bg-slate-800 text-slate-300 px-3 py-1.5 rounded-full font-medium whitespace-nowrap border border-slate-700">Plyometrie</button>
                    <button onclick="filterCat('Brzdění a změny směru')" class="cat-btn bg-slate-800 text-slate-300 px-3 py-1.5 rounded-full font-medium whitespace-nowrap border border-slate-700">Brzdění & Změny</button>
                </div>
            </div>
            <div id="container-cviceni" class="space-y-3 mt-3"></div>
        </section>

        <!-- SEKCE 3: VALD -->
        <section id="sec-vald" class="tab-content hidden space-y-4">
            <h2 class="text-lg font-bold text-white flex items-center gap-2">
                <i data-lucide="activity" class="w-5 h-5 text-emerald-400"></i> Testování VALD
            </h2>
            <div id="container-vald" class="space-y-4"></div>
        </section>

        <!-- SEKCE 4: VÝKONNOSTNÍ NORMY -->
        <section id="sec-normy" class="tab-content hidden space-y-4">
            <h2 class="text-lg font-bold text-white flex items-center gap-2">
                <i data-lucide="trophy" class="w-5 h-5 text-amber-400"></i> Výkonnostní normy
            </h2>
            <div id="container-normy" class="space-y-4"></div>
        </section>

        <!-- SEKCE 5: METODIKA -->
        <section id="sec-metodika" class="tab-content hidden space-y-4">
            <h2 class="text-lg font-bold text-white flex items-center gap-2">
                <i data-lucide="book-open" class="w-5 h-5 text-purple-400"></i> Metodické pokyny
            </h2>
            <div id="container-metodika" class="space-y-4"></div>
        </section>

    </main>

    <!-- Modal detailu cvičení -->
    <div id="modal-cviceni" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm hidden items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-lg rounded-t-2xl sm:rounded-xl p-5 space-y-4 max-h-[85vh] overflow-y-auto">
            <div class="flex items-start justify-between border-b border-slate-800 pb-3">
                <div>
                    <span id="modal-id" class="text-xs font-bold text-sky-400 bg-sky-950 px-2 py-0.5 rounded border border-sky-800"></span>
                    <h3 id="modal-nazev" class="text-lg font-bold text-white mt-1"></h3>
                </div>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white p-1">
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>
            </div>
            <div class="space-y-3 text-sm">
                <div>
                    <div class="text-xs text-slate-400 uppercase font-semibold">Dávkování</div>
                    <div id="modal-davkovani" class="text-slate-200 font-medium"></div>
                </div>
                <div>
                    <div class="text-xs text-slate-400 uppercase font-semibold">Popis cvičení</div>
                    <div id="modal-popis" class="text-slate-300 whitespace-pre-line leading-relaxed"></div>
                </div>
                <div class="bg-slate-800/60 p-3 rounded-lg border border-slate-700/50">
                    <div class="text-xs text-emerald-400 font-bold uppercase flex items-center gap-1">
                        <i data-lucide="target" class="w-3.5 h-3.5"></i> Trenérský fokus
                    </div>
                    <div id="modal-fokus" class="text-slate-200 mt-1 italic"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Spodní navigace -->
    <nav class="fixed bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur border-t border-slate-800 z-40 px-2 py-1.5 flex justify-around">
        <button onclick="switchTab('treninky')" class="nav-btn active flex flex-col items-center gap-1 py-1 px-2 text-emerald-400">
            <i data-lucide="calendar" class="w-5 h-5"></i>
            <span class="text-[10px] font-medium">Tréninky</span>
        </button>
        <button onclick="switchTab('cviceni')" class="nav-btn flex flex-col items-center gap-1 py-1 px-2 text-slate-400 hover:text-slate-200">
            <i data-lucide="database" class="w-5 h-5"></i>
            <span class="text-[10px] font-medium">Cvičení</span>
        </button>
        <button onclick="switchTab('vald')" class="nav-btn flex flex-col items-center gap-1 py-1 px-2 text-slate-400 hover:text-slate-200">
            <i data-lucide="activity" class="w-5 h-5"></i>
            <span class="text-[10px] font-medium">VALD</span>
        </button>
        <button onclick="switchTab('normy')" class="nav-btn flex flex-col items-center gap-1 py-1 px-2 text-slate-400 hover:text-slate-200">
            <i data-lucide="trophy" class="w-5 h-5"></i>
            <span class="text-[10px] font-medium">Normy</span>
        </button>
        <button onclick="switchTab('metodika')" class="nav-btn flex flex-col items-center gap-1 py-1 px-2 text-slate-400 hover:text-slate-200">
            <i data-lucide="book-open" class="w-5 h-5"></i>
            <span class="text-[10px] font-medium">Metodika</span>
        </button>
    </nav>

    <!-- Skripty -->
    <script>
        const SPREADSHEET_ID = "1aiNOlAD1TsergSK9E_SY4oc_zmkqESp2W1LnxAvLn30";
        
        let appData = { Treninky: [], Cviceni: [], VALD: [], Normy: [], Metodika: [] };
        let activeCategory = 'Vše';

        document.addEventListener("DOMContentLoaded", () => {
            lucide.createIcons();
            fetchData();
        });

        async function fetchData() {
            const refreshIcon = document.getElementById('refresh-icon');
            const statusText = document.getElementById('status-text');
            
            if (refreshIcon) refreshIcon.classList.add('animate-spin');
            statusText.innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span> Načítání dat...`;

            try {
                const sheetNames = ['Treninky', 'Cviceni', 'VALD', 'Normy', 'Metodika'];
                const results = await Promise.all(sheetNames.map(name => fetchGvizSheetByIndex(name)));
                
                sheetNames.forEach((name, index) => {
                    appData[name] = results[index];
                });

                statusText.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500"></span> Data aktuální`;
                document.getElementById('last-update').innerText = new Date().toLocaleTimeString('cs-CZ', {hour: '2-digit', minute:'2-digit'});

                renderAll();
            } catch (err) {
                console.error(err);
                statusText.innerHTML = `<span class="w-2 h-2 rounded-full bg-red-500"></span> Chyba načítání`;
                document.getElementById('container-treninky').innerHTML = `<div class="p-4 bg-slate-900 rounded-lg text-slate-400 text-sm">Zkontrolujte SPREADSHEET_ID v kódu.</div>`;
            } finally {
                if (refreshIcon) refreshIcon.classList.remove('animate-spin');
            }
        }

        async function fetchGvizSheetByIndex(sheetName) {
            const url = `https://docs.google.com/spreadsheets/d/${1aiNOlAD1TsergSK9E_SY4oc_zmkqESp2W1LnxAvLn30}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheetName)}`;
            const response = await fetch(url);
            const text = await response.text();
            
            const jsonString = text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1);
            const json = JSON.parse(jsonString);
            
            // .slice(1) přeskočí první řádek s hlavičkou tabulky, aby se data neposunula
            const rows = json.table.rows.slice(1);
            
            return rows.map(r => {
                const c = r && r.c ? r.c : [];
                const getCell = (idx) => (c[idx] && c[idx].v !== null && c[idx].v !== undefined) ? c[idx].v : '';

                if (sheetName === 'Treninky') {
                    return {
                        varianta: getCell(0),
                        skupina: getCell(1),
                        kategorie: getCell(2),
                        misto_cas_delka: getCell(3),
                        cil: getCell(4),
                        pomucky: getCell(5),
                        cviceni_ids: getCell(6),
                        harmonogram: getCell(7),
                        pokyny: getCell(8)
                    };
                } else if (sheetName === 'Cviceni') {
                    return {
                        id: getCell(0),
                        nazev: getCell(1),
                        kategorie_skupina: getCell(2),
                        davkovani: getCell(3),
                        popis: getCell(4),
                        fokus: getCell(5)
                    };
                } else if (sheetName === 'VALD') {
                    return {
                        sekce: getCell(0),
                        nadpis: getCell(1),
                        obsah: getCell(2)
                    };
                } else if (sheetName === 'Normy') {
                    return {
                        skupina: getCell(0),
                        metrika: getCell(1),
                        hodnota: getCell(2),
                        jednotka: getCell(3),
                        kategorie: getCell(4),
                        post: getCell(5),
                        uroven: getCell(6),
                        zdroj: getCell(7)
                    };
                } else if (sheetName === 'Metodika') {
                    return {
                        tema: getCell(0),
                        nadpis: getCell(1),
                        text: getCell(2)
                    };
                }
                return {};
            });
        }

        function renderAll() {
            renderTreninky();
            renderCviceni();
            renderVALD();
            renderNormy();
            renderMetodika();
            lucide.createIcons();
        }

        function val(field) {
            return (field !== undefined && field !== null && String(field).trim() !== '') ? field : '<span class="text-red-400 italic text-xs">[Chybějící údaj]</span>';
        }

        function renderTreninky() {
            const container = document.getElementById('container-treninky');
            if (!appData.Treninky || appData.Treninky.length === 0) {
                container.innerHTML = `<div class="p-4 bg-slate-900 rounded-lg text-slate-400 text-sm">Žádné tréninky nebyly nalezeny.</div>`;
                return;
            }

            container.innerHTML = appData.Treninky.map(t => {
                const cviceniBadges = t.cviceni_ids ? String(t.cviceni_ids).split(',').map(id => id.trim()).filter(id => id).map(id => 
                    `<button onclick="openCviceniModal('\${id}')" class="bg-sky-950 text-sky-400 border border-sky-800 px-2 py-0.5 rounded text-xs font-semibold hover:bg-sky-900 transition">\${id}</button>`
                ).join(' ') : '<span class="text-xs text-slate-500">Žádná přiřazená cvičení</span>';

                return `
                <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-sm">
                    <div class="p-4 space-y-2">
                        <div class="flex items-start justify-between gap-2">
                            <div>
                                <span class="text-[10px] font-bold text-emerald-400 bg-emerald-950/80 border border-emerald-800 px-2 py-0.5 rounded uppercase tracking-wider">\${val(t.varianta)}</span>
                                <h3 class="text-base font-bold text-white mt-1">\${val(t.skupina)}</h3>
                            </div>
                            <span class="text-xs font-medium text-slate-400 bg-slate-800 px-2 py-1 rounded whitespace-nowrap">\${val(t.kategorie)}</span>
                        </div>
                        
                        <div class="text-xs text-slate-300 flex items-center gap-1.5">
                            <i data-lucide="map-pin" class="w-3.5 h-3.5 text-slate-400 shrink-0"></i>
                            <span>\${val(t.misto_cas_delka)}</span>
                        </div>
                        
                        <div class="text-xs text-slate-300"><strong class="text-slate-400">Cíl:</strong> \${val(t.cil)}</div>
                        <div class="text-xs text-slate-300"><strong class="text-slate-400">Pomůcky:</strong> \${val(t.pomucky)}</div>

                        <div class="pt-2 flex flex-wrap gap-1 items-center">
                            <span class="text-xs text-slate-400 mr-1 font-semibold">Cvičení:</span>
                            \${cviceniBadges}
                        </div>
                    </div>

                    <details class="group border-t border-slate-800/80 bg-slate-900/50">
                        <summary class="flex items-center justify-between px-4 py-2.5 text-xs font-medium text-slate-400 cursor-pointer hover:text-slate-200">
                            <span>Harmonogram a trenérské pokyny</span>
                            <i data-lucide="chevron-down" class="w-4 h-4 transition-transform group-open:rotate-180"></i>
                        </summary>
                        <div class="px-4 pb-4 pt-1 space-y-3 text-xs border-t border-slate-800/50">
                            <div>
                                <div class="font-semibold text-slate-300 mb-1">Časový rozpis:</div>
                                <div class="text-slate-400 bg-slate-950 p-2.5 rounded border border-slate-800/80 whitespace-pre-line leading-relaxed">\${val(t.harmonogram)}</div>
                            </div>
                            <div>
                                <div class="font-semibold text-emerald-400 mb-1">Pokyny pro trenéry:</div>
                                <div class="text-slate-300 bg-emerald-950/20 border border-emerald-900/40 p-2.5 rounded leading-relaxed">\${val(t.pokyny)}</div>
                            </div>
                        </div>
                    </details>
                </div>
                `;
            }).join('');
        }

        function renderCviceni() {
            const container = document.getElementById('container-cviceni');
            const searchVal = document.getElementById('search-cviceni').value.toLowerCase();
            
            if (!appData.Cviceni || appData.Cviceni.length === 0) {
                container.innerHTML = `<div class="p-4 bg-slate-900 rounded-lg text-slate-400 text-sm">Knihovna cvičení je prázdná.</div>`;
                return;
            }

            const filtered = appData.Cviceni.filter(c => {
                const matchCat = (activeCategory === 'Vše') || (c.kategorie_skupina === activeCategory);
                const matchSearch = String(c.id).toLowerCase().includes(searchVal) || 
                                    String(c.nazev).toLowerCase().includes(searchVal) ||
                                    String(c.popis).toLowerCase().includes(searchVal);
                return matchCat && matchSearch;
            });

            if (filtered.length === 0) {
                container.innerHTML = `<div class="p-4 bg-slate-900 rounded-lg text-slate-400 text-sm">Zadání neodpovídá žádné cvičení.</div>`;
                return;
            }

            container.innerHTML = filtered.map(c => `
                <div class="bg-slate
