<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SCM Rugby Babice – Trenérský portál</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Rugby Babice">
    <meta name="theme-color" content="#0f172a">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        babice: {
                            dark: '#0f172a',
                            card: '#1e293b',
                            green: '#22c55e',
                            blue: '#0284c7',
                            accent: '#38bdf8'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        body { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen pb-24 select-none">

    <!-- Horní hlavička -->
    <header class="sticky top-0 z-40 bg-slate-900/95 backdrop-blur border-b border-slate-800 px-4 py-3 flex items-center justify-between shadow-md">
        <div class="flex items-center gap-3">
            <div class="h-10 w-10 rounded-lg bg-gradient-to-br from-emerald-600 to-sky-600 flex items-center justify-center font-black text-white text-base shadow border border-slate-700">
                RB
            </div>
            <div>
                <h1 class="font-bold text-base leading-none text-white tracking-wide">SCM RUGBY BABICE</h1>
                <p class="text-xs text-slate-400 font-medium mt-0.5">Trenérský portál • Zimní příprava</p>
            </div>
        </div>
        <button onclick="fetchData()" title="Obnovit data" class="p-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg border border-slate-700 active:scale-95 transition">
            <i data-lucide="refresh-cw" class="w-5 h-5" id="refresh-icon"></i>
        </button>
    </header>

    <!-- Stavové hlášení -->
    <div id="status-bar" class="px-4 py-2 bg-slate-900 border-b border-slate-800 text-xs text-slate-400 flex items-center justify-between">
        <span id="status-text" class="flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span> Načítání z Google Apps Script API...
        </span>
        <span id="last-update" class="text-[10px] text-slate-500"></span>
    </div>

    <!-- Hlavní obsahový kontejner -->
    <main class="max-w-3xl mx-auto p-4">

        <!-- SEKCE 1: TRÉNINKY -->
        <section id="sec-treninky" class="tab-content block space-y-4">
            <div class="flex items-center justify-between mb-2">
                <h2 class="text-lg font-bold text-white flex items-center gap-2">
                    <i data-lucide="calendar" class="w-5 h-5 text-emerald-400"></i> Tréninkové jednotky
                </h2>
                <span class="text-xs text-slate-400">Zimní příprava</span>
            </div>
            <div id="container-treninky" class="space-y-4"></div>
        </section>

        <!-- SEKCE 2: KNIHOVNA CVIČENÍ -->
        <section id="sec-cviceni" class="tab-content hidden space-y-4">
            <div class="flex flex-col gap-3 mb-2">
                <div class="flex items-center justify-between">
                    <h2 class="text-lg font-bold text-white flex items-center gap-2">
                        <i data-lucide="database" class="w-5 h-5 text-sky-400"></i> Knihovna cvičení
                    </h2>
                </div>
                <div class="relative">
                    <i data-lucide="search" class="w-4 h-4 absolute left-3 top-3 text-slate-500"></i>
                    <input type="text" id="search-cviceni" oninput="filterCviceni()" placeholder="Hledat cvičení (název, kód, popis...)" 
                           class="w-full bg-slate-900 border border-slate-800 rounded-lg pl-9 pr-4 py-2 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-sky-500">
                </div>
                <div id="cat-buttons" class="flex gap-2 overflow-x-auto no-scrollbar pb-1 text-xs">
                    <button onclick="filterCat('Vše')" class="cat-btn active bg-sky-600 text-white px-3 py-1.5 rounded-full font-medium whitespace-nowrap">Vše</button>
                </div>
            </div>
            <div id="container-cviceni" class="space-y-3"></div>
        </section>

        <!-- SEKCE 3: VALD -->
        <section id="sec-vald" class="tab-content hidden space-y-4">
            <h2 class="text-lg font-bold text-white flex items-center gap-2">
                <i data-lucide="activity" class="w-5 h-5 text-emerald-400"></i> Testovací protokoly VALD
            </h2>
            <div id="container-vald" class="space-y-4"></div>
        </section>

        <!-- SEKCE 4: VÝKONNOSTNÍ NORMY -->
        <section id="sec-normy" class="tab-content hidden space-y-4">
            <h2 class="text-lg font-bold text-white flex items-center gap-2">
                <i data-lucide="trophy" class="w-5 h-5 text-amber-400"></i> Výkonnostní normy SCM
            </h2>
            <div id="container-normy" class="space-y-4"></div>
        </section>

        <!-- SEKCE 5: METODIKA -->
        <section id="sec-metodika" class="tab-content hidden space-y-4">
            <h2 class="text-lg font-bold text-white flex items-center gap-2">
                <i data-lucide="book-open" class="w-5 h-5 text-purple-400"></i> Metodické pokyny a koncepce
            </h2>
            <div id="container-metodika" class="space-y-4"></div>
        </section>

    </main>

    <!-- Modal detailu cvičení -->
    <div id="modal-cviceni" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm hidden items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-lg rounded-t-2xl sm:rounded-xl p-5 space-y-4 max-h-[85vh] overflow-y-auto shadow-2xl">
            <div class="flex items-start justify-between border-b border-slate-800 pb-3">
                <div>
                    <span id="modal-id" class="text-xs font-bold text-sky-400 bg-sky-950 px-2 py-0.5 rounded border border-sky-800"></span>
                    <h3 id="modal-nazev" class="text-lg font-bold text-white mt-1"></h3>
                </div>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white p-1">
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>
            </div>
            <div class="space-y-3 text-sm">
                <div>
                    <div class="text-xs text-slate-400 uppercase font-semibold">Dávkování</div>
                    <div id="modal-davkovani" class="text-slate-200 font-medium mt-0.5"></div>
                </div>
                <div>
                    <div class="text-xs text-slate-400 uppercase font-semibold">Popis cvičení</div>
                    <div id="modal-popis" class="text-slate-300 whitespace-pre-line leading-relaxed mt-0.5"></div>
                </div>
                <div class="bg-slate-800/60 p-3 rounded-lg border border-slate-700/50">
                    <div class="text-xs text-emerald-400 font-bold uppercase flex items-center gap-1">
                        <i data-lucide="target" class="w-3.5 h-3.5"></i> Trenérský fokus
                    </div>
                    <div id="modal-fokus" class="text-slate-200 mt-1 italic"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Spodní mobilní navigace -->
    <nav class="fixed bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur border-t border-slate-800 z-40 px-2 py-2 flex justify-around shadow-lg">
        <button onclick="switchTab('treninky')" class="nav-btn active flex flex-col items-center gap-1 py-1 px-3 text-emerald-400 transition">
            <i data-lucide="calendar" class="w-5 h-5"></i>
            <span class="text-[10px] font-medium">Tréninky</span>
        </button>
        <button onclick="switchTab('cviceni')" class="nav-btn flex flex-col items-center gap-1 py-1 px-3 text-slate-400 hover:text-slate-200 transition">
            <i data-lucide="database" class="w-5 h-5"></i>
            <span class="text-[10px] font-medium">Cvičení</span>
        </button>
        <button onclick="switchTab('vald')" class="nav-btn flex flex-col items-center gap-1 py-1 px-3 text-slate-400 hover:text-slate-200 transition">
            <i data-lucide="activity" class="w-5 h-5"></i>
            <span class="text-[10px] font-medium">VALD</span>
        </button>
        <button onclick="switchTab('normy')" class="nav-btn flex flex-col items-center gap-1 py-1 px-3 text-slate-400 hover:text-slate-200 transition">
            <i data-lucide="trophy" class="w-5 h-5"></i>
            <span class="text-[10px] font-medium">Normy</span>
        </button>
        <button onclick="switchTab('metodika')" class="nav-btn flex flex-col items-center gap-1 py-1 px-3 text-slate-400 hover:text-slate-200 transition">
            <i data-lucide="book-open" class="w-5 h-5"></i>
            <span class="text-[10px] font-medium">Metodika</span>
        </button>
    </nav>

    <!-- Skripty -->
    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbyFkrxmaPDmCo0IPmeQT9EwZIyuHPgRmng3qJTrnaHGPFKu8DK7Q_53KvaEfxLmrlVx3Q/exec";
        
        let appData = { Treninky: [], Cviceni: [], VALD: [], Normy: [], Metodika: [] };
        let activeCategory = 'Vše';

        document.addEventListener("DOMContentLoaded", () => {
            lucide.createIcons();
            fetchData();
        });

        async function fetchData() {
            const refreshIcon = document.getElementById('refresh-icon');
            const statusText = document.getElementById('status-text');
            
            if (refreshIcon) refreshIcon.classList.add('animate-spin');
            statusText.innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span> Načítání z API...`;

            try {
                const sheetNames = ['Treninky', 'Cviceni', 'VALD', 'Normy', 'Metodika'];
                
                // Paralelní načtení všech 5 záložek
                const results = await Promise.all(sheetNames.map(name => fetchSingleSheet(name)));
                
                sheetNames.forEach((name, index) => {
                    appData[name] = results[index] || [];
                });

                statusText.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500"></span> Data aktuální`;
                document.getElementById('last-update').innerText = new Date().toLocaleTimeString('cs-CZ', {hour: '2-digit', minute:'2-digit'});

                renderAll();
            } catch (err) {
                console.error("Chyba načítání:", err);
                statusText.innerHTML = `<span class="w-2 h-2 rounded-full bg-red-500"></span> Chyba načtení API`;
                document.getElementById('container-treninky').innerHTML = `
                    <div class="p-4 bg-red-950/60 border border-red-800 rounded-xl text-red-200 text-sm space-y-2">
                        <strong class="block text-base text-white">Chyba připojení k Google Apps Script API</strong>
                        <p>Zkontrolujte, zda je Web App nasazena s přístupem pro <em>"Anyone" (Kdokoliv)</em>.</p>
                        <p class="text-xs text-red-300 font-mono">${err.message || err}</p>
                    </div>`;
            } finally {
                if (refreshIcon) refreshIcon.classList.remove('animate-spin');
            }
        }

        async function fetchSingleSheet(sheetName) {
            const fetchUrl = `${API_URL}?sheet=${encodeURIComponent(sheetName)}`;
            const response = await fetch(fetchUrl, { redirect: 'follow' });
            if (!response.ok) throw new Error(`HTTP chyba ${response.status}`);
            const data = await response.json();
            
            return parseRawSheetData(data, sheetName);
        }

        function parseRawSheetData(raw, sheetName) {
            if (!raw || !Array.isArray(raw) || raw.length === 0) return [];
            
            // Pokud skript vrací pole objektů přímo z klíčů
            if (typeof raw[0] === 'object' && !Array.isArray(raw[0])) {
                return raw;
            }

            // Pokud skript vrací matici pole (rows x cols)
            const rows = raw;
            const headers = rows[0].map(h => String(h || '').trim());
            const dataRows = rows.slice(1);

            return dataRows.map(row => {
                const obj = {};
                row.forEach((cellVal, colIdx) => {
                    const cleanVal = (cellVal !== null && cellVal !== undefined) ? String(cellVal).trim() : '';
                    
                    // Uložíme podle indexu col_0, col_1...
                    obj[`col_${colIdx}`] = cleanVal;

                    // Uložíme podle původní hlavičky
                    if (headers[colIdx]) {
                        obj[headers[colIdx]] = cleanVal;
                        
                        // Uložíme i pod čitelným klíčem bez diakritiky
                        const cleanKey = headers[colIdx].toLowerCase()
                            .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
                            .replace(/[^a-z0-9]/g, '_')
                            .replace(/_+/g, '_')
                            .replace(/^_|_$/g, '');
                        obj[cleanKey] = cleanVal;
                    }
                });
                return obj;
            });
        }

        function renderAll() {
            renderTreninky();
            renderCviceni();
            renderVALD();
            renderNormy();
            renderMetodika();
            lucide.createIcons();
        }

        function val(obj, keys, defaultText = '-') {
            if (!obj) return defaultText;
            for (let k of keys) {
                if (obj[k] !== undefined && obj[k] !== null && String(obj[k]).trim() !== '') {
                    return obj[k];
                }
            }
            return defaultText;
        }

        function renderTreninky() {
            const container = document.getElementById('container-treninky');
            const data = appData.Treninky;

            if (!data || data.length === 0) {
                container.innerHTML = `<div class="p-4 bg-slate-900 rounded-lg text-slate-400 text-sm">V tabulce 'Treninky' nejsou žádná data.</div>`;
                return;
            }

            container.innerHTML = data.map(t => {
                const varianta = val(t, ['varianta', 'col_0']);
                const skupina = val(t, ['skupina', 'col_1']);
                const kategorie = val(t, ['kategorie', 'col_2']);
                const misto = val(t, ['misto_cas_delka', 'misto', 'col_3']);
                const cil = val(t, ['cil', 'col_4']);
                const pomucky = val(t, ['pomucky', 'col_5']);
                const cviceniIds = val(t, ['cviceni_ids', 'cviceni', 'col_6'], '');
                const harmonogram = val(t, ['harmonogram', 'col_7']);
                const pokyny = val(t, ['pokyny', 'col_8']);

                const cviceniBadges = cviceniIds ? String(cviceniIds).split(',').map(id => id.trim()).filter(id => id).map(id => 
                    `<button onclick="openCviceniModal('${id}')" class="bg-sky-950 text-sky-400 border border-sky-800 px-2 py-0.5 rounded text-xs font-semibold hover:bg-sky-900 transition">${id}</button>`
                ).join(' ') : '<span class="text-xs text-slate-500">Bez přiřazených cvičení</span>';

                return `
                <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-sm">
                    <div class="p-4 space-y-2">
                        <div class="flex items-start justify-between gap-2">
                            <div>
                                <span class="text-[10px] font-bold text-emerald-400 bg-emerald-950/80 border border-emerald-800 px-2 py-0.5 rounded uppercase tracking-wider">${varianta}</span>
                                <h3 class="text-base font-bold text-white mt-1">${skupina}</h3>
                            </div>
                            <span class="text-xs font-medium text-slate-400 bg-slate-800 px-2 py-1 rounded whitespace-nowrap">${kategorie}</span>
                        </div>
                        
                        <div class="text-xs text-slate-300 flex items-center gap-1.5">
                            <i data-lucide="map-pin" class="w-3.5 h-3.5 text-slate-400 shrink-0"></i>
                            <span>${misto}</span>
                        </div>
                        
                        <div class="text-xs text-slate-300"><strong class="text-slate-400">Cíl:</strong> ${cil}</div>
                        <div class="text-xs text-slate-300"><strong class="text-slate-400">Pomůcky:</strong> ${pomucky}</div>

                        <div class="pt-2 flex flex-wrap gap-1 items-center">
                            <span class="text-xs text-slate-400 mr-1 font-semibold">Cvičení:</span>
                            ${cviceniBadges}
                        </div>
                    </div>

                    <details class="group border-t border-slate-800/80 bg-slate-900/50">
                        <summary class="flex items-center justify-between px-4 py-2.5 text-xs font-medium text-slate-400 cursor-pointer hover:text-slate-200">
                            <span>Harmonogram a trenérské pokyny</span>
                            <i data-lucide="chevron-down" class="w-4 h-4 transition-transform group-open:rotate-180"></i>
                        </summary>
                        <div class="px-4 pb-4 pt-1 space-y-3 text-xs border-t border-slate-800/50">
                            <div>
                                <div class="font-semibold text-slate-300 mb-1">Časový rozpis:</div>
                                <div class="text-slate-400 bg-slate-950 p-2.5 rounded border border-slate-800/80 whitespace-pre-line leading-relaxed">${harmonogram}</div>
                            </div>
                            <div>
                                <div class="font-semibold text-emerald-400 mb-1">Pokyny pro trenéry:</div>
                                <div class="text-slate-300 bg-emerald-950/20 border border-emerald-900/40 p-2.5 rounded leading-relaxed">${pokyny}</div>
                            </div>
                        </div>
                    </details>
                </div>
                `;
            }).join('');
        }

        function renderCviceni() {
            const container = document.getElementById('container-cviceni');
            const data = appData.Cviceni;
            const searchVal = document.getElementById('search-cviceni').value.toLowerCase();

            if (!data || data.length === 0) {
                container.innerHTML = `<div class="p-4 bg-slate-900 rounded-lg text-slate-400 text-sm">V tabulce 'Cviceni' nejsou žádná data.</div>`;
                return;
            }

            // Příprava dynamických kategorií
            const cats = ['Vše', ...new Set(data.map(c => val(c, ['kategorie_skupina', 'kategorie', 'col_2'])).filter(x => x !== '-'))];
            const catContainer = document.getElementById('cat-buttons');
            catContainer.innerHTML = cats.map(c => `
                <button onclick="filterCat('${c}')" class="cat-btn ${activeCategory === c ? 'bg-sky-600 text-white' : 'bg-slate-800 text-slate-300'} px-3 py-1.5 rounded-full font-medium whitespace-nowrap border border-slate-700">${c}</button>
            `).join('');

            const filtered = data.filter(c => {
                const cat = val(c, ['kategorie_skupina', 'kategorie', 'col_2']);
                const matchCat = (activeCategory === 'Vše') || (cat === activeCategory);
                
                const id = String(val(c, ['id', 'col_0'])).toLowerCase();
                const nazev = String(val(c, ['nazev', 'col_1'])).toLowerCase();
                const popis = String(val(c, ['popis', 'col_4'])).toLowerCase();
                
                const matchSearch = id.includes(searchVal) || nazev.includes(searchVal) || popis.includes(searchVal);
                return matchCat && matchSearch;
            });

            if (filtered.length === 0) {
                container.innerHTML = `<div class="p-4 bg-slate-900 rounded-lg text-slate-400 text-sm">Zadaným kritériím neodpovídá žádné cvičení.</div>`;
                return;
            }

            container.innerHTML = filtered.map(c => `
                <div class="bg-slate-900 border border-slate-800 rounded-lg p-3.5 space-y-2">
                    <div class="flex items-start justify-between gap-2">
                        <div class="flex items-center gap-2">
                            <span class="text-xs font-bold text-sky-400 bg-sky-950 border border-sky-800 px-2 py-0.5 rounded">${val(c, ['id', 'col_0'])}</span>
                            <h4 class="font-bold text-slate-100 text-sm">${val(c, ['nazev', 'col_1'])}</h4>
                        </div>
                        <span class="text-[10px] text-slate-400 bg-slate-800 px-2 py-0.5 rounded">${val(c, ['kategorie_skupina', 'kategorie', 'col_2'])}</span>
                    </div>
                    <div class="text-xs text-slate-300"><strong class="text-slate-400">Dávkování:</strong> ${val(c, ['davkovani', 'col_3'])}</div>
                    <p class="text-xs text-slate-400 leading-relaxed">${val(c, ['popis', 'col_4'])}</p>
                    <div class="bg-slate-950 p-2 rounded border border-slate-800/80 text-xs">
                        <span class="text-emerald-400 font-semibold">Fokus:</span> <span class="text-slate-300">${val(c, ['fokus', 'col_5'])}</span>
                    </div>
                </div>
            `).join('');
        }

        function renderVALD() {
            const container = document.getElementById('container-vald');
            const data = appData.VALD;

            if (!data || data.length === 0) {
                container.innerHTML = `<div class="p-4 bg-slate-900 rounded-lg text-slate-400 text-sm">V tabulce 'VALD' nejsou žádné protokoly.</div>`;
                return;
            }

            container.innerHTML = data.map(v => `
                <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 space-y-2">
                    <span class="text-[10px] font-bold text-emerald-400 uppercase bg-emerald-950/80 border border-emerald-800 px-2 py-0.5 rounded">${val(v, ['sekce', 'col_0'])}</span>
                    <h3 class="text-base font-bold text-white">${val(v, ['nadpis', 'col_1'])}</h3>
                    <div class="text-xs text-slate-300 whitespace-pre-line leading-relaxed pt-1">${val(v, ['obsah', 'text', 'col_2'])}</div>
                </div>
            `).join('');
        }

        function renderNormy() {
            const container = document.getElementById('container-normy');
            const data = appData.Normy;

            if (!data || data.length === 0) {
                container.innerHTML = `<div class="p-4 bg-slate-900 rounded-lg text-slate-400 text-sm">V tabulce 'Normy' nebyly nalezeny žádné záznamy.</div>`;
                return;
            }

            const groups = {};
            data.forEach(n => {
                const g = val(n, ['skupina', 'col_0'], 'Ostatní');
                if (!groups[g]) groups[g] = [];
                groups[g].push(n);
            });

            container.innerHTML = Object.keys(groups).map(g => `
                <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 space-y-3">
                    <h3 class="font-bold text-white text-base border-b border-slate-800 pb-2">${g}</h3>
                    <div class="space-y-2">
                        ${groups[g].map(item => `
                            <div class="bg-slate-950 p-3 rounded-lg border border-slate-800 flex flex-col gap-1 text-xs">
                                <div class="flex items-center justify-between">
                                    <span class="font-bold text-slate-200">${val(item, ['metrika', 'col_1'])}</span>
                                    <span class="text-amber-400 font-bold bg-amber-950/50 border border-amber-800 px-2 py-0.5 rounded">${val(item, ['hodnota', 'col_2'])} ${val(item, ['jednotka', 'col_3'], '')}</span>
                                </div>
                                <div class="text-slate-400 flex flex-wrap gap-2 text-[11px] mt-1">
                                    <span>Kat: ${val(item, ['kategorie', 'col_4'])}</span>
                                    <span>•</span>
                                    <span>Post: ${val(item, ['post', 'col_5'])}</span>
                                    <span>•</span>
                                    <span class="text-sky-400 font-medium">${val(item, ['uroven', 'col_6'])}</span>
                                </div>
                                ${val(item, ['zdroj', 'col_7'], '') !== '-' ? `<div class="text-[10px] text-slate-500 italic mt-0.5">Zdroj: ${val(item, ['zdroj', 'col_7'])}</div>` : ''}
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        function renderMetodika() {
            const container = document.getElementById('container-metodika');
            const data = appData.Metodika;

            if (!data || data.length === 0) {
                container.innerHTML = `<div class="p-4 bg-slate-900 rounded-lg text-slate-400 text-sm">V tabulce 'Metodika' nejsou žádná data.</div>`;
                return;
            }

            container.innerHTML = data.map(m => `
                <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 space-y-2">
                    <span class="text-[10px] font-bold text-purple-400 uppercase bg-purple-950/80 border border-purple-800 px-2 py-0.5 rounded">${val(m, ['tema', 'col_0'])}</span>
                    <h3 class="text-base font-bold text-white">${val(m, ['nadpis', 'col_1'])}</h3>
                    <div class="text-xs text-slate-300 whitespace-pre-line leading-relaxed pt-1">${val(m, ['text', 'obsah', 'col_2'])}</div>
                </div>
            `).join('');
        }

        function openCviceniModal(id) {
            const data = appData.Cviceni || [];
            const c = data.find(item => String(val(item, ['id', 'col_0'])).trim().toLowerCase() === String(id).trim().toLowerCase());
            
            if (!c) {
                alert(`Cvičení s kódem "${id}" nebylo v knihovně cvičení nalezeno.`);
                return;
            }
            document.getElementById('modal-id').innerText = val(c, ['id', 'col_0']);
            document.getElementById('modal-nazev').innerText = val(c, ['nazev', 'col_1']);
            document.getElementById('modal-davkovani').innerText = val(c, ['davkovani', 'col_3']);
            document.getElementById('modal-popis').innerText = val(c, ['popis', 'col_4']);
            document.getElementById('modal-fokus').innerText = val(c, ['fokus', 'col_5']);

            const modal = document.getElementById('modal-cviceni');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeModal() {
            const modal = document.getElementById('modal-cviceni');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.nav-btn').forEach(el => {
                el.classList.remove('active', 'text-emerald-400');
                el.classList.add('text-slate-400');
            });
            const selectedTab = document.getElementById(`sec-${tabId}`);
            if (selectedTab) selectedTab.classList.remove('hidden');

            const activeNavBtn = event.currentTarget;
            if (activeNavBtn) {
                activeNavBtn.classList.add('active', 'text-emerald-400');
                activeNavBtn.classList.remove('text-slate-400');
            }
        }

        function filterCat(category) {
            activeCategory = category;
            renderCviceni();
        }

        function filterCviceni() {
            renderCviceni();
        }
    </script>
</body>
</html>
